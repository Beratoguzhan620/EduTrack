name: Deploy EduTrack

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: edutrack-production
  cancel-in-progress: true

env:
  APP_NAME: edutrack
  IMAGE_NAME: ghcr.io/alikemaluysal/edutrack
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            mkdir -p /opt/deploy/edutrack
            touch /opt/deploy/edutrack/.env
            chmod 600 /opt/deploy/edutrack/.env

      - name: Copy Docker Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: /opt/deploy/edutrack
          overwrite: true

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -eu

            cd /opt/deploy/edutrack

            printf '%s' "$GHCR_TOKEN" |
              docker login ghcr.io \
                --username "$GHCR_USER" \
                --password-stdin

            IMAGE_TAG="$IMAGE_TAG" docker compose pull

            IMAGE_TAG="$IMAGE_TAG" docker compose up \
              -d \
              --remove-orphans

            sleep 5

            test "$(docker inspect -f '{{.State.Running}}' edutrack)" = "true"

            docker compose ps
            docker logs --tail 50 edutrack

            docker logout ghcr.io
            docker image prune -af --filter "until=168h"