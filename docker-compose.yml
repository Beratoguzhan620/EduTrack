# Local run with one command: docker compose up --build
# Web app: http://localhost:8080  ·  File API (Swagger): http://localhost:8081/swagger
# The production deployment uses deploy/docker-compose.yml instead.
name: edutrack

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-EduTrack#Local2026}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  fileapi:
    build:
      context: .
      dockerfile: external-services/FileAPI/Dockerfile
    environment:
      FileServer__ApiKey: ${FILE_API_KEY:-local-dev-key}
    ports:
      - "8081:8080"
    volumes:
      - files:/data/files

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      fileapi:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=EduTrack;User Id=sa;Password=${DB_PASSWORD:-EduTrack#Local2026};TrustServerCertificate=True;"
      FileApi__BaseUrl: http://fileapi:8080/
      FileApi__PublicUrl: http://localhost:8081/
      FileApi__ApiKey: ${FILE_API_KEY:-local-dev-key}
      Seed__DemoContent: "true"
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"
    volumes:
      - data-protection:/app/data-protection-keys

volumes:
  db-data:
  files:
  data-protection:
